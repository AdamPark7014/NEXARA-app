name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npx prisma generate
      - name: Unit tests (tenant isolation + core)
        run: npm test -- --coverage=false
      - name: Typecheck API
        run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true

  web-build-gate:
    runs-on: ubuntu-latest
    needs: api-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint web package.json present
        run: test -f apps/web/package.json
