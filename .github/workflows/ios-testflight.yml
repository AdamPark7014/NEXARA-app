name: iOS TestFlight (Free GHA)

on:
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: "TestFlight release notes (optional)"
        required: false
        default: ""
  push:
    tags:
      - "ios-testflight-*"

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      XCODE_PROJECT_PATH: apps/mobile-native/ios/NexaraApp.xcodeproj
      XCODE_SCHEME: NexaraApp
      ARCHIVE_PATH: ${{ github.workspace }}/build/NexaraApp.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export
      EXPORT_PLIST: ${{ github.workspace }}/build/ExportOptions.plist
      BUNDLE_ID: mx.nexara.mobile.NexaraApp
      TEAM_ID: 49J96Q3WQ3
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Show macOS and Xcode
        run: |
          sw_vers
          xcodebuild -version
          which xcodebuild

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project from XcodeGen spec
        working-directory: apps/mobile-native/ios
        run: |
          if [ -f project.yml ]; then SPEC_FILE=project.yml; elif [ -f project.yaml ]; then SPEC_FILE=project.yaml; else echo "XcodeGen spec not found"; exit 1; fi
          echo "Using XcodeGen spec: ${SPEC_FILE}"
          xcodegen generate --spec "${SPEC_FILE}"
          test -d NexaraApp.xcodeproj

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY}" ]; then
            echo "Missing App Store Connect API secrets"; exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          umask 177
          printf "%s" "${ASC_PRIVATE_KEY}" > "${KEY_PATH}"
          echo "ASC key written to ${KEY_PATH}"
          echo "ASC_KEY_PATH=${KEY_PATH}" >> $GITHUB_ENV

      - name: Optional — import provided private key into keychain
        run: |
          set -euo pipefail
          if [ -n "${CERTIFICATE_PRIVATE_KEY}" ]; then
            echo "Importing CERTIFICATE_PRIVATE_KEY into keychain (no password)"
            KEY_PEM="$RUNNER_TEMP/codesign.key.pem"
            umask 177
            printf "%s" "${CERTIFICATE_PRIVATE_KEY}" > "${KEY_PEM}"
            # Try to import as a key (may not be linked to a cert; xcodebuild may still create a new certificate)
            security import "${KEY_PEM}" -A -T /usr/bin/codesign -T /usr/bin/security || true
          else
            echo "No CERTIFICATE_PRIVATE_KEY provided; relying on Xcode automatic signing with ASC API key."
          fi

      - name: Create ExportOptions.plist (App Store)
        run: |
          mkdir -p "$(dirname "$EXPORT_PLIST")"
          cat > "$EXPORT_PLIST" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
            </dict>
          </plist>
          PLIST
          cat "$EXPORT_PLIST"

      - name: Archive (Release, iOS Device) with automatic signing via ASC API key
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          mkdir -p "$DERIVED"
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT_PATH" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$RUNNER_TEMP/BuildResult" \
            archive -archivePath "$ARCHIVE_PATH"
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::group::Last 200 lines of latest xcactivitylog"
            LATEST_LOG=$(ls -t "$DERIVED/Logs/Build"/*.xcactivitylog 2>/dev/null | head -n 1 || true)
            if [ -n "$LATEST_LOG" ] && [ -f "$LATEST_LOG" ]; then
              echo "Log file: $LATEST_LOG"
              strings "$LATEST_LOG" | tail -n 200 || true
            else
              echo "No xcactivitylog found under $DERIVED/Logs/Build"
            fi
            echo "::endgroup::"
            exit $STATUS
          fi

      - name: Export signed IPA (App Store)
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lah "$EXPORT_DIR"

      - name: Upload to TestFlight (Transporter API key)
        run: |
          set -euo pipefail
          IPA="$(ls -1 "$EXPORT_DIR"/*.ipa | head -n 1)"
          if [ ! -f "$IPA" ]; then echo "IPA not found"; ls -R "$EXPORT_DIR"; exit 1; fi
          echo "Uploading $IPA to TestFlight..."
          xcrun iTMSTransporter -m upload -assetFile "$IPA" -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v informative
          echo "Upload requested. Processing may take several minutes on App Store Connect."

