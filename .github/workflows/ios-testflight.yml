name: iOS TestFlight (Free GHA)

on:
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: "TestFlight release notes (optional)"
        required: false
        default: ""
  push:
    tags:
      - "ios-testflight-*"

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      XCODE_PROJECT_PATH: apps/mobile-native/ios/NexaraApp.xcodeproj
      XCODE_SCHEME: NexaraApp
      ARCHIVE_PATH: ${{ github.workspace }}/build/NexaraApp.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export
      EXPORT_PLIST: ${{ github.workspace }}/build/ExportOptions.plist
      BUNDLE_ID: mx.nexara.mobile.NexaraApp
      TEAM_ID: AHNW9K8745
      # Preferred secrets to build .p12 on runner:
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}             # PEM (PKCS#8)
      DISTRIBUTION_CERT_CER_BASE64: ${{ secrets.DISTRIBUTION_CERT_CER_BASE64 }}   # Apple .cer (DER) base64
      # Optional fallback if above not provided:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}           # base64 .p12
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}                                   # password for .p12
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Show macOS and Xcode
        run: |
          sw_vers
          xcodebuild -version
          which xcodebuild

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project from XcodeGen spec
        working-directory: apps/mobile-native/ios
        run: |
          if [ -f project.yml ]; then SPEC_FILE=project.yml; elif [ -f project.yaml ]; then SPEC_FILE=project.yaml; else echo "XcodeGen spec not found"; exit 1; fi
          echo "Using XcodeGen spec: ${SPEC_FILE}"
          xcodegen generate --spec "${SPEC_FILE}"
          test -d NexaraApp.xcodeproj
      # Removed fragile regex patch; a structured patch runs later to bind app and disable others

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY}" ]; then
            echo "Missing App Store Connect API secrets"; exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          umask 177
          printf "%s" "${ASC_PRIVATE_KEY}" > "${KEY_PATH}"
          echo "ASC key written to ${KEY_PATH}"
          echo "ASC_KEY_PATH=${KEY_PATH}" >> $GITHUB_ENV

      - name: Install signing cert and provisioning profile (manual signing)
        run: |
          set -euo pipefail
          if [ -z "${BUILD_PROVISION_PROFILE_BASE64}" ]; then
            echo "Missing provisioning profile secret (BUILD_PROVISION_PROFILE_BASE64)"; exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 12)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          # Preferred path: construct a macOS-compatible .p12 from PEM key + DER cert
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ] && [ -n "${DISTRIBUTION_CERT_CER_BASE64:-}" ]; then
            echo "Building .p12 from CERTIFICATE_PRIVATE_KEY and DISTRIBUTION_CERT_CER_BASE64"
            KEY_PEM="$RUNNER_TEMP/dist.key.pem"
            CERT_DER="$RUNNER_TEMP/dist.cer"
            CERT_PEM="$RUNNER_TEMP/dist.pem"
            printf '%s' "${CERTIFICATE_PRIVATE_KEY}" > "$KEY_PEM"
            echo "${DISTRIBUTION_CERT_CER_BASE64}" | base64 --decode > "$CERT_DER"
            openssl x509 -inform DER -in "$CERT_DER" -out "$CERT_PEM"
            P12_PATH="$RUNNER_TEMP/dist.p12"
            P12_PASS="$(openssl rand -hex 16)"
            (openssl pkcs12 -export -inkey "$KEY_PEM" -in "$CERT_PEM" \
              -out "$P12_PATH" -passout pass:"$P12_PASS" \
              -macalg sha1 -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES) || \
            (openssl pkcs12 -export -legacy -inkey "$KEY_PEM" -in "$CERT_PEM" \
              -out "$P12_PATH" -passout pass:"$P12_PASS")
            security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASS" -A -T /usr/bin/codesign -T /usr/bin/security
          elif [ -n "${BUILD_CERTIFICATE_BASE64:-}" ] && [ -n "${P12_PASSWORD:-}" ]; then
            echo "Falling back to provided .p12"
            P12_PATH="$RUNNER_TEMP/certificate.p12"
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$P12_PATH"
            security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          else
            echo "No signing certificate provided. Provide CERTIFICATE_PRIVATE_KEY + DISTRIBUTION_CERT_CER_BASE64 or BUILD_CERTIFICATE_BASE64 + P12_PASSWORD."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          TMP_PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$TMP_PROFILE"
          PLIST_OUT="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$TMP_PROFILE" > "$PLIST_OUT"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PLIST_OUT")
          DEST_MOBILE="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          DEST_USERDATA="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          cp "$TMP_PROFILE" "$DEST_MOBILE"
          cp "$TMP_PROFILE" "$DEST_USERDATA"
          echo "Installed provisioning profile UUID=$PROFILE_UUID at:"
          echo " - $DEST_MOBILE"
          echo " - $DEST_USERDATA"
          # Expose UUID for subsequent steps
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Debug provisioning profile metadata
        run: |
          set -euo pipefail
          PLIST_OUT="$RUNNER_TEMP/profile-debug.plist"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision" > "$PLIST_OUT"
          echo "Profile Name: $(/usr/libexec/PlistBuddy -c 'Print Name' "$PLIST_OUT" || true)"
          echo "Profile UUID: $(/usr/libexec/PlistBuddy -c 'Print UUID' "$PLIST_OUT" || true)"
          echo "Team ID(s): $(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PLIST_OUT" || true)"
          echo "Entitlements aps-environment: $(/usr/libexec/PlistBuddy -c 'Print Entitlements:aps-environment' "$PLIST_OUT" || true)"
          echo "Listing profiles directories:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" || true

      - name: Verify entitlements and bundle id in build settings
        run: |
          set -euo pipefail
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT_PATH" -scheme "$XCODE_SCHEME" -configuration Release > "$RUNNER_TEMP/buildsettings.txt"
          echo "::group::Build Settings (filtered)"
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS" "$RUNNER_TEMP/buildsettings.txt" || true
          echo "::endgroup::"
          ENT_PATH=$(grep -E "CODE_SIGN_ENTITLEMENTS =" "$RUNNER_TEMP/buildsettings.txt" | awk -F'= ' '{print $2}' | tr -d '[:space:]' | tail -n 1)
          PROJ_DIR="$(cd "$(dirname "$XCODE_PROJECT_PATH")" && pwd)"
          if [ -z "$ENT_PATH" ]; then
            echo "ERROR: CODE_SIGN_ENTITLEMENTS is not set in build settings"; exit 1
          fi
          case "$ENT_PATH" in
            /*) ENT_ABS="$ENT_PATH" ;;
            *)  ENT_ABS="$PROJ_DIR/$ENT_PATH" ;;
          esac
          echo "Resolved entitlements path: $ENT_ABS"
          test -f "$ENT_ABS" || { echo "ERROR: Entitlements file missing at $ENT_ABS"; exit 1; }
          echo "aps-environment in entitlements:"
          /usr/libexec/PlistBuddy -c 'Print aps-environment' "$ENT_ABS" || true

      - name: Bind signing for app target and disable others (structured pbxproj patch)
        working-directory: apps/mobile-native/ios
        run: |
          set -euo pipefail
          if [ -z "${PROFILE_UUID:-}" ]; then echo "PROFILE_UUID missing"; exit 1; fi
          python3 - << 'PY'
          import re, os, sys
          path = "NexaraApp.xcodeproj/project.pbxproj"
          with open(path, "r", encoding="utf-8") as f:
              s = f.read()
          profile_uuid = os.environ.get("PROFILE_UUID","")
          TEAM = "AHNW9K8745"
          # Find all native targets with their config list UUIDs and names
          targets = []
          for tm in re.finditer(r'([A-F0-9]{24}) /\\* (.*?) \\*/ = \\{\\s*isa = PBXNativeTarget;[\\s\\S]*?buildConfigurationList = ([A-F0-9]{24}) /\\* Build configuration list for PBXNativeTarget \"(.*?)\" \\*/;', s):
              target_uuid = tm.group(1)
              target_name_comment = tm.group(2)
              cfg_list_uuid = tm.group(3)
              target_name = tm.group(4)
              targets.append((target_uuid, target_name, cfg_list_uuid))
          # Helper: get config UUIDs from a configuration list UUID
          def get_cfg_uuids(cfg_list_uuid, target_name):
              lm = re.search(rf'{cfg_list_uuid} /\\* Build configuration list for PBXNativeTarget \"{re.escape(target_name)}\" \\*/ = \\{{[\\s\\S]*?buildConfigurations = \\(([\\s\\S]*?)\\);', s)
              if not lm:
                  return []
              inside = lm.group(1)
              return re.findall(r'([A-F0-9]{24}) /\\* .*? \\*/,?', inside)
          # Helper: patch one XCBuildConfiguration's buildSettings
          def patch_config(txt, cfg_uuid, settings_to_set, keys_to_clear):
              pat = rf'({cfg_uuid}) /\\* .*? \\*/ = \\{{\\s*isa = XCBuildConfiguration;\\s*buildSettings = \\{{([\\s\\S]*?)\\}};\\s*name = .*?;\\s*\\}};'
              def repl(m):
                  body = m.group(2)
                  # remove any existing relevant keys
                  for k in set(list(keys_to_clear) + list(settings_to_set.keys())):
                      body = re.sub(rf'\\s*{re.escape(k)}\\s*=\\s*[^;]*;', '', body)
                  # inject desired settings
                  inject_lines = []
                  for k,v in settings_to_set.items():
                      inject_lines.append(f"\\n\\t\\t\\t\\t{k} = {v};")
                  new_body = body.rstrip() + ''.join(inject_lines) + "\\n\\t\\t\\t"
                  return m.group(0).replace(m.group(2), new_body)
              return re.sub(pat, repl, txt, count=1, flags=re.S)
          # Compute app and non-app config UUIDs
          app_cfgs = set()
          other_cfgs = set()
          for _, name, cfg_list in targets:
              cfgs = get_cfg_uuids(cfg_list, name)
              if name == "NexaraApp":
                  app_cfgs.update(cfgs)
              else:
                  other_cfgs.update(cfgs)
          # Apply patches
          clear_app = ["CODE_SIGN_STYLE","CODE_SIGN_IDENTITY","DEVELOPMENT_TEAM","PROVISIONING_PROFILE","PROVISIONING_PROFILE_SPECIFIER"]
          app_set = {
              "CODE_SIGN_STYLE": "Manual",
              "CODE_SIGN_IDENTITY": "\\\"Apple Distribution\\\"",
              "DEVELOPMENT_TEAM": TEAM,
              "PROVISIONING_PROFILE": f"\\\"{profile_uuid}\\\"",
              "PROVISIONING_PROFILE_SPECIFIER": "\\\"NEXARA App Store\\\"",
          }
          for cfg in app_cfgs:
              s = patch_config(s, cfg, app_set, clear_app)
          clear_other = ["CODE_SIGN_STYLE","CODE_SIGN_IDENTITY","DEVELOPMENT_TEAM","PROVISIONING_PROFILE","PROVISIONING_PROFILE_SPECIFIER","CODE_SIGNING_ALLOWED","CODE_SIGNING_REQUIRED"]
          other_set = {
              "CODE_SIGNING_ALLOWED": "NO",
              "CODE_SIGNING_REQUIRED": "NO",
              "CODE_SIGN_IDENTITY": "",
              "PROVISIONING_PROFILE": "",
              "PROVISIONING_PROFILE_SPECIFIER": "",
          }
          for cfg in other_cfgs:
              s = patch_config(s, cfg, other_set, clear_other)
          with open(path, "w", encoding="utf-8") as f:
              f.write(s)
          print(f"Patched {len(app_cfgs)} app configs and {len(other_cfgs)} non-app configs.")
          PY

      - name: Verify app target provisioning profile binding
        run: |
          set -euo pipefail
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT_PATH" -target NexaraApp -configuration Release > "$RUNNER_TEMP/buildsettings_after_patch.txt"
          echo "::group::Code signing (post-patch)"
          egrep "^( *CODE_SIGN_STYLE| *PROVISIONING_PROFILE| *DEVELOPMENT_TEAM| *CODE_SIGN_IDENTITY| *PRODUCT_BUNDLE_IDENTIFIER) =" "$RUNNER_TEMP/buildsettings_after_patch.txt" || true
          echo "::endgroup::"
          PROFILE_VAL=$(grep -E "^ *PROVISIONING_PROFILE =" "$RUNNER_TEMP/buildsettings_after_patch.txt" | awk -F'= ' '{print $2}' | tr -d '[:space:]' | tail -n 1)
          if [ -z "$PROFILE_VAL" ] || [ "$PROFILE_VAL" = "(null)" ]; then
            echo "ERROR: PROVISIONING_PROFILE is not set for app target in build settings."; exit 1
          fi
          if [ "$PROFILE_VAL" != "$PROFILE_UUID" ]; then
            echo "ERROR: PROVISIONING_PROFILE ($PROFILE_VAL) != PROFILE_UUID ($PROFILE_UUID)"; exit 1
          fi
          TEAM_VAL=$(grep -E "^ *DEVELOPMENT_TEAM =" "$RUNNER_TEMP/buildsettings_after_patch.txt" | awk -F'= ' '{print $2}' | tr -d '[:space:]' | tail -n 1)
          if [ "$TEAM_VAL" != "AHNW9K8745" ]; then
            echo "ERROR: DEVELOPMENT_TEAM is $TEAM_VAL, expected AHNW9K8745"; exit 1
          fi
          ID_VAL=$(grep -E "^ *CODE_SIGN_IDENTITY =" "$RUNNER_TEMP/buildsettings_after_patch.txt" | awk -F'= ' '{print $2}' | tr -d '[:space:]' | tail -n 1)
          case "$ID_VAL" in
            *Distribution*) : ;;
            *) echo "ERROR: CODE_SIGN_IDENTITY does not indicate a Distribution identity: $ID_VAL"; exit 1 ;;
          esac

      - name: Create ExportOptions.plist (App Store, manual)
        run: |
          mkdir -p "$(dirname "$EXPORT_PLIST")"
          cat > "$EXPORT_PLIST" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>mx.nexara.mobile.NexaraApp</key>
                <string>NEXARA App Store</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
            </dict>
          </plist>
          PLIST
          cat "$EXPORT_PLIST"

      - name: Archive (Release, iOS Device) — manual signing
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          mkdir -p "$DERIVED"
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT_PATH" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/codesign.keychain-db" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$RUNNER_TEMP/BuildResult" \
            archive -archivePath "$ARCHIVE_PATH"
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::group::Last 200 lines of latest xcactivitylog"
            LATEST_LOG=$(ls -t "$DERIVED/Logs/Build"/*.xcactivitylog 2>/dev/null | head -n 1 || true)
            if [ -n "$LATEST_LOG" ] && [ -f "$LATEST_LOG" ]; then
              echo "Log file: $LATEST_LOG"
              strings "$LATEST_LOG" | tail -n 200 || true
            else
              echo "No xcactivitylog found under $DERIVED/Logs/Build"
            fi
            echo "::endgroup::"
            exit $STATUS
          fi

      - name: Export signed IPA (App Store)
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$EXPORT_DIR"
          ls -lah "$EXPORT_DIR"

      - name: Upload to TestFlight (Transporter API key)
        run: |
          set -euo pipefail
          IPA="$(ls -1 "$EXPORT_DIR"/*.ipa | head -n 1)"
          if [ ! -f "$IPA" ]; then echo "IPA not found"; ls -R "$EXPORT_DIR"; exit 1; fi
          echo "Uploading $IPA to TestFlight..."
          xcrun iTMSTransporter -m upload -assetFile "$IPA" -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v informative
          echo "Upload requested. Processing may take several minutes on App Store Connect."

