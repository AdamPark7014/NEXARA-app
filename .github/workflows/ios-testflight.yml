name: iOS TestFlight (Free GHA)

on:
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: "TestFlight release notes (optional)"
        required: false
        default: ""
  push:
    tags:
      - "ios-testflight-*"

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      XCODE_PROJECT_PATH: apps/mobile-native/ios/NexaraApp.xcodeproj
      XCODE_SCHEME: NexaraApp
      ARCHIVE_PATH: ${{ github.workspace }}/build/NexaraApp.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export
      EXPORT_PLIST: ${{ github.workspace }}/build/ExportOptions.plist
      BUNDLE_ID: mx.nexara.mobile.NexaraApp
      TEAM_ID: AHNW9K8745
      # Preferred secrets to build .p12 on runner:
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}             # PEM (PKCS#8)
      DISTRIBUTION_CERT_CER_BASE64: ${{ secrets.DISTRIBUTION_CERT_CER_BASE64 }}   # Apple .cer (DER) base64
      # Optional fallback if above not provided:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}           # base64 .p12
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}                                   # password for .p12
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Ensure iOS 26 SDK (switch if multiple Xcodes available)
        run: |
          set -euo pipefail
          echo "Initial Xcode: $(xcode-select -p)"
          echo "::group::Installed Xcodes"
          ls -1 /Applications | sed -n 's/^/ - /p' || true
          echo "::endgroup::"
          # Try to find an installed Xcode that reports iPhoneOS SDK >= 26
          bestPath=""
          bestVer=""
          for X in /Applications/Xcode*.app; do
            if [ -d "$X/Contents/Developer" ]; then
              sudo xcode-select -s "$X/Contents/Developer" || true
              SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)"
              if [ -n "$SDK_VER" ]; then
                echo "Xcode at $X has iPhoneOS SDK $SDK_VER"
                if [ -z "$bestVer" ] || [ "$(printf '%s\n' "$bestVer" "$SDK_VER" | sort -V | tail -n1)" = "$SDK_VER" ]; then
                  bestVer="$SDK_VER"
                  bestPath="$X/Contents/Developer"
                fi
              fi
            fi
          done
          if [ -n "$bestPath" ]; then
            echo "Selecting Xcode with highest iPhoneOS SDK ($bestVer): $bestPath"
            sudo xcode-select -s "$bestPath"
          fi
          SEL_VER="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)"
          echo "Selected iPhoneOS SDK version: ${SEL_VER:-<unknown>}"
          if [ -z "$SEL_VER" ] || [ "$(printf '%s\n' "26.0" "${SEL_VER}" | sort -V | tail -n1)" != "${SEL_VER}" ]; then
            echo "WARNING: Could not confirm iOS 26 SDK. Proceeding, but App Store validation may fail if SDK < 26."
          fi

      - name: Initialize Xcode platforms (ensure iOS device SDK is available)
        run: |
          set -euo pipefail
          echo "Xcode path: $(xcode-select -p)"
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true
          # Retry iOS platform download up to 3 times
          n=0
          until [ $n -ge 3 ]; do
            echo "Attempt $((n+1)) to download iOS platform SDK…"
            if xcodebuild -downloadPlatform iOS; then
              break
            fi
            n=$((n+1)); sleep 30
          done
          echo "Installed SDKs:"
          xcodebuild -showsdks || true
          IOS_PLATFORM_DIR="$(xcode-select -p)/Platforms/iPhoneOS.platform"
          if [ ! -d "$IOS_PLATFORM_DIR" ]; then
            echo "ERROR: iPhoneOS.platform not found at $IOS_PLATFORM_DIR"; exit 1
          fi
          echo "Found iPhoneOS.platform at $IOS_PLATFORM_DIR"

      - name: Show macOS and Xcode
        run: |
          sw_vers
          xcodebuild -version
          which xcodebuild

      - name: Ensure required AppIcon sizes (120, 152, 1024)
        run: |
          set -euo pipefail
          ICONSET="${GITHUB_WORKSPACE}/apps/mobile-native/ios/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          SRC_1024_TMP="$RUNNER_TEMP/src-1024.png"
          if [ ! -f "$ICONSET/icon-1024.png" ]; then
            echo "icon-1024.png not found; fetching brand mark and generating..."
            TMP_SRC="$RUNNER_TEMP/brand-src.png"
            curl -fsSL "https://nexara.com.mx/brand/nexara-mark-v4-512.png" -o "$TMP_SRC"
            sips -s format png -z 1024 1024 "$TMP_SRC" --out "$SRC_1024_TMP" >/dev/null
          else
            cp "$ICONSET/icon-1024.png" "$SRC_1024_TMP"
          fi
          # Strip alpha by round-tripping via BMP (BMP has no alpha)
          BMP_NOALPHA="$RUNNER_TEMP/icon-1024-noalpha.bmp"
          FINAL_1024="$ICONSET/icon-1024.png"
          sips -s format bmp "$SRC_1024_TMP" --out "$BMP_NOALPHA" >/dev/null
          sips -s format png "$BMP_NOALPHA" --out "$FINAL_1024" >/dev/null
          # Generate required iPhone/iPad sizes from the non-alpha 1024
          sips -s format png -z 120 120 "$FINAL_1024" --out "$ICONSET/icon-120.png" >/dev/null
          sips -s format png -z 152 152 "$FINAL_1024" --out "$ICONSET/icon-152.png" >/dev/null
          echo "::group::sips metadata (alpha) for icons"
          sips -g all "$FINAL_1024" | grep -i alpha || true
          sips -g all "$ICONSET/icon-120.png" | grep -i alpha || true
          sips -g all "$ICONSET/icon-152.png" | grep -i alpha || true
          echo "::endgroup::"
          echo "AppIcon contents:"
          ls -lah "$ICONSET" || true

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project from XcodeGen spec
        working-directory: apps/mobile-native/ios
        run: |
          if [ -f project.yml ]; then SPEC_FILE=project.yml; elif [ -f project.yaml ]; then SPEC_FILE=project.yaml; else echo "XcodeGen spec not found"; exit 1; fi
          echo "Using XcodeGen spec: ${SPEC_FILE}"
          xcodegen generate --spec "${SPEC_FILE}"
          test -d NexaraApp.xcodeproj
      - name: Verify pbxproj uses explicit Info.plist
        run: |
          set -euo pipefail
          PBX="apps/mobile-native/ios/NexaraApp.xcodeproj/project.pbxproj"
          if ! grep -qE 'INFOPLIST_FILE *= *Resources/Info.plist' "$PBX"; then
            echo "ERROR: INFOPLIST_FILE not set to Resources/Info.plist in pbxproj"; exit 1
          fi
          if ! grep -qE 'GENERATE_INFOPLIST_FILE *= *NO' "$PBX"; then
            echo "ERROR: GENERATE_INFOPLIST_FILE is not NO in pbxproj"; exit 1
          fi
      - name: Verify iOS device destination is available (post-project)
        run: |
          set -euo pipefail
          echo "Available destinations for scheme NexaraApp:"
          xcodebuild -showdestinations -project "$XCODE_PROJECT_PATH" -scheme "$XCODE_SCHEME" -configuration Release || true
          # Not all Xcode versions list generic destinations here; fallback to SDK path check as gate
          IOS_PLATFORM_DIR="$(xcode-select -p)/Platforms/iPhoneOS.platform"
          if [ ! -d "$IOS_PLATFORM_DIR" ]; then
            echo "ERROR: iPhoneOS.platform missing after initialization step: $IOS_PLATFORM_DIR"; exit 1
          fi
      # Removed fragile regex patch; a structured patch runs later to bind app and disable others

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY}" ]; then
            echo "Missing App Store Connect API secrets"; exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          umask 177
          printf "%s" "${ASC_PRIVATE_KEY}" > "${KEY_PATH}"
          echo "ASC key written to ${KEY_PATH}"
          echo "ASC_KEY_PATH=${KEY_PATH}" >> $GITHUB_ENV
          # Point altool to the temp directory containing AuthKey_<KEYID>.p8
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP" >> $GITHUB_ENV

      - name: Install provisioning profile (dual paths)
        run: |
          set -euo pipefail
          if [ -z "${BUILD_PROVISION_PROFILE_BASE64}" ]; then
            echo "Missing provisioning profile secret (BUILD_PROVISION_PROFILE_BASE64)"; exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          TMP_PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$TMP_PROFILE"
          PLIST_OUT="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$TMP_PROFILE" > "$PLIST_OUT"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PLIST_OUT")
          DEST_MOBILE="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          DEST_USERDATA="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          cp "$TMP_PROFILE" "$DEST_MOBILE"
          cp "$TMP_PROFILE" "$DEST_USERDATA"
          echo "Installed provisioning profile UUID=$PROFILE_UUID at:"
          echo " - $DEST_MOBILE"
          echo " - $DEST_USERDATA"
          # Expose UUID for subsequent steps
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build and import Distribution signing certificate (.p12)
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 12)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ] && [ -n "${DISTRIBUTION_CERT_CER_BASE64:-}" ]; then
            echo "Building .p12 from CERTIFICATE_PRIVATE_KEY and DISTRIBUTION_CERT_CER_BASE64"
            KEY_PEM="$RUNNER_TEMP/dist.key.pem"
            CERT_DER="$RUNNER_TEMP/dist.cer"
            CERT_PEM="$RUNNER_TEMP/dist.pem"
            printf '%s' "${CERTIFICATE_PRIVATE_KEY}" > "$KEY_PEM"
            echo "${DISTRIBUTION_CERT_CER_BASE64}" | base64 --decode > "$CERT_DER"
            openssl x509 -inform DER -in "$CERT_DER" -out "$CERT_PEM"
            P12_PATH="$RUNNER_TEMP/dist.p12"
            P12_PASS="$(openssl rand -hex 16)"
            (openssl pkcs12 -export -inkey "$KEY_PEM" -in "$CERT_PEM" \
              -out "$P12_PATH" -passout pass:"$P12_PASS" \
              -macalg sha1 -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES) || \
            (openssl pkcs12 -export -legacy -inkey "$KEY_PEM" -in "$CERT_PEM" \
              -out "$P12_PATH" -passout pass:"$P12_PASS")
            security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASS" -A -T /usr/bin/codesign -T /usr/bin/security
          elif [ -n "${BUILD_CERTIFICATE_BASE64:-}" ] && [ -n "${P12_PASSWORD:-}" ]; then
            echo "Falling back to provided .p12"
            P12_PATH="$RUNNER_TEMP/certificate.p12"
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$P12_PATH"
            security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          else
            echo "No signing certificate provided. Provide CERTIFICATE_PRIVATE_KEY + DISTRIBUTION_CERT_CER_BASE64 or BUILD_CERTIFICATE_BASE64 + P12_PASSWORD."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "::group::Available code signing identities"
          security find-identity -v -p codesigning || true
          echo "::endgroup::"

      - name: Debug provisioning profile metadata
        run: |
          set -euo pipefail
          PLIST_OUT="$RUNNER_TEMP/profile-debug.plist"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision" > "$PLIST_OUT"
          echo "Profile Name: $(/usr/libexec/PlistBuddy -c 'Print Name' "$PLIST_OUT" || true)"
          echo "Profile UUID: $(/usr/libexec/PlistBuddy -c 'Print UUID' "$PLIST_OUT" || true)"
          echo "Team ID(s): $(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PLIST_OUT" || true)"
          echo "Entitlements aps-environment: $(/usr/libexec/PlistBuddy -c 'Print Entitlements:aps-environment' "$PLIST_OUT" || true)"
          echo "Listing profiles directories:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" || true

      - name: Verify entitlements and bundle id in build settings
        run: |
          set -euo pipefail
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT_PATH" -target NexaraApp -configuration Release > "$RUNNER_TEMP/buildsettings.txt"
          echo "::group::Build Settings (filtered)"
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS" "$RUNNER_TEMP/buildsettings.txt" || true
          echo "::endgroup::"
          ENT_PATH=$(grep -E "CODE_SIGN_ENTITLEMENTS =" "$RUNNER_TEMP/buildsettings.txt" | awk -F'= ' '{print $2}' | tr -d '[:space:]' | tail -n 1)
          PROJ_DIR="$(cd "$(dirname "$XCODE_PROJECT_PATH")" && pwd)"
          if [ -z "$ENT_PATH" ]; then
            echo "ERROR: CODE_SIGN_ENTITLEMENTS is not set in build settings"; exit 1
          fi
          case "$ENT_PATH" in
            /*) ENT_ABS="$ENT_PATH" ;;
            *)  ENT_ABS="$PROJ_DIR/$ENT_PATH" ;;
          esac
          echo "Resolved entitlements path: $ENT_ABS"
          test -f "$ENT_ABS" || { echo "ERROR: Entitlements file missing at $ENT_ABS"; exit 1; }
          echo "aps-environment in entitlements:"
          /usr/libexec/PlistBuddy -c 'Print aps-environment' "$ENT_ABS" || true

      - name: Bind manual signing for NexaraApp (pbxproj)
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/ios_bind_app_signing.py" \
            "apps/mobile-native/ios/NexaraApp.xcodeproj/project.pbxproj" \
            "NexaraApp" "AHNW9K8745" "$PROFILE_UUID" "NEXARA App Store" "Apple Distribution"
          PBXPROJ="apps/mobile-native/ios/NexaraApp.xcodeproj/project.pbxproj"
          grep -q "PROVISIONING_PROFILE = \\\"${PROFILE_UUID}\\\";" "$PBXPROJ" || { echo "ERROR: PROVISIONING_PROFILE UUID not found in pbxproj"; exit 1; }

      - name: Create ExportOptions.plist (App Store, manual)
        run: |
          mkdir -p "$(dirname "$EXPORT_PLIST")"
          cat > "$EXPORT_PLIST" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>mx.nexara.mobile.NexaraApp</key>
                <string>NEXARA App Store</string>
              </dict>
              <key>teamID</key>
              <string>AHNW9K8745</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
            </dict>
          </plist>
          PLIST
          cat "$EXPORT_PLIST"

      - name: Verify Info.plist config before archive
        run: |
          set -euo pipefail
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT_PATH" -scheme "$XCODE_SCHEME" -configuration Release | grep -E 'INFOPLIST_FILE|GENERATE_INFOPLIST_FILE|PRODUCT_BUNDLE_IDENTIFIER' || true
          PLIST_REL="apps/mobile-native/ios/Resources/Info.plist"
          PLIST_ABS="$GITHUB_WORKSPACE/apps/mobile-native/ios/Resources/Info.plist"
          echo "Intended Info.plist (relative): $PLIST_REL"
          echo "Intended Info.plist (absolute): $PLIST_ABS"
          if [ ! -f "$PLIST_ABS" ]; then echo "ERROR: Intended Info.plist not found at $PLIST_ABS"; exit 1; fi
          /usr/libexec/PlistBuddy -c 'Print UISupportedInterfaceOrientations' "$PLIST_ABS" || true
          /usr/libexec/PlistBuddy -c 'Print UISupportedInterfaceOrientations~ipad' "$PLIST_ABS" || true
          /usr/libexec/PlistBuddy -c 'Print UILaunchScreen' "$PLIST_ABS" || true
          /usr/bin/plutil -lint "$PLIST_ABS" || true

      - name: Archive (Release, iOS Device) — Manual signing from pbxproj
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          mkdir -p "$DERIVED"
          set +e
          ARCH_LOG="$RUNNER_TEMP/archive.log"
          xcodebuild \
            -project "$XCODE_PROJECT_PATH" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/codesign.keychain-db" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$RUNNER_TEMP/BuildResult" \
            INFOPLIST_FILE="$GITHUB_WORKSPACE/apps/mobile-native/ios/Resources/Info.plist" \
            GENERATE_INFOPLIST_FILE=NO \
            archive -archivePath "$ARCHIVE_PATH" 2>&1 | tee "$ARCH_LOG"
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "::group::Last 200 lines of latest xcactivitylog"
            LATEST_LOG=$(ls -t "$DERIVED/Logs/Build"/*.xcactivitylog 2>/dev/null | head -n 1 || true)
            if [ -n "$LATEST_LOG" ] && [ -f "$LATEST_LOG" ]; then
              echo "Log file: $LATEST_LOG"
              strings "$LATEST_LOG" | tail -n 200 || true
            else
              echo "No xcactivitylog found under $DERIVED/Logs/Build"
            fi
            echo "::endgroup::"
            exit $STATUS
          fi
          echo "::group::Archive Info.plist diagnostics"
          grep -E "ProcessInfoPlistFile|Info\\.plist|INFOPLIST" "$ARCH_LOG" || true
          echo "::endgroup::"

      - name: Patch embedded Info.plist (launch/orientations/icons)
        run: |
          set -euo pipefail
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive directory missing at $ARCHIVE_PATH"; exit 1
          fi
          APP_DIR="$(/usr/bin/find "$ARCHIVE_PATH" -maxdepth 3 -type d -name '*.app' | head -n 1 || true)"
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not locate .app inside archive at $ARCHIVE_PATH"; ls -R "$ARCHIVE_PATH" || true; exit 1
          fi
          PLIST="$APP_DIR/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found at $PLIST"; ls -R "$APP_DIR" || true; exit 1
          fi
          echo "Patching $PLIST"
          echo "::group::Before patch (plutil -p)"
          /usr/bin/plutil -p "$PLIST" | head -n 100 || true
          echo "::endgroup::"
          # Ensure UILaunchScreen dict and safe area inset flag
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :UILaunchScreen dict' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UILaunchScreenRespectsSafeAreaInsets' "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :UILaunchScreen:UILaunchScreenRespectsSafeAreaInsets bool true' "$PLIST"
          # iPhone orientations
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$PLIST" 2>/dev/null || {
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations array' "$PLIST"
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait' "$PLIST"
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          }
          # iPad orientations (tilde key)
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations~ipad' "$PLIST" 2>/dev/null || {
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad array' "$PLIST"
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait' "$PLIST"
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown' "$PLIST"
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
            /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          }
          # CFBundleIconName
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIconName string AppIcon' "$PLIST"
          /usr/bin/plutil -lint "$PLIST" || { echo "ERROR: Patched Info.plist failed lint"; exit 1; }
          echo "::group::After patch (plutil -p)"
          /usr/bin/plutil -p "$PLIST" | head -n 100 || true
          echo "::endgroup::"

      - name: Neutralize Starscream resource bundles
        run: |
          set -euo pipefail
          APP_DIR="$(/usr/bin/find "$ARCHIVE_PATH" -maxdepth 3 -type d -name '*.app' | head -n 1 || true)"
          echo "Scanning for Starscream bundles in: $APP_DIR"
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not locate .app inside archive at $ARCHIVE_PATH"; ls -R "$ARCHIVE_PATH" || true; exit 1
          fi
          echo "::group::All .bundle paths"
          /usr/bin/find "$APP_DIR" -type d -name '*.bundle' -print || true
          echo "::endgroup::"
          removed=0
          while IFS= read -r -d '' bundle; do
            id=""
            if [ -f "$bundle/Info.plist" ]; then
              id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$bundle/Info.plist" 2>/dev/null || echo "")
            fi
            name="$(basename "$bundle")"
            if echo "$name" | grep -qi 'Starscream' || echo "$id" | grep -qi '^starscream\\.' ; then
              echo "Removing Starscream bundle: $bundle (CFBundleIdentifier='$id')"
              rm -rf "$bundle"
              removed=$((removed+1))
            fi
          done < <(/usr/bin/find "$APP_DIR" -type d -name '*.bundle' -print0)
          echo "REMOVED_COUNT=$removed"
      - name: Inspect built Info.plist in archive (launch/orientations)
        run: |
          set -euo pipefail
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive directory missing at $ARCHIVE_PATH"; ls -l "$(dirname "$ARCHIVE_PATH")" || true; exit 1
          fi
          APP_DIR="$(/usr/bin/find "$ARCHIVE_PATH" -maxdepth 3 -type d -name '*.app' | head -n 1 || true)"
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not locate .app inside archive at $ARCHIVE_PATH"; ls -R "$ARCHIVE_PATH" || true; exit 1
          fi
          APP_INFO_PLIST="$APP_DIR/Info.plist"
          if [ ! -f "$APP_INFO_PLIST" ]; then
            echo "ERROR: Info.plist not found at $APP_INFO_PLIST"; ls -R "$APP_DIR" || true; exit 1
          fi
          echo "::group::Embedded Info.plist keys"
          echo "Found .app: $APP_DIR"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIconName' "$APP_INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c 'Print UILaunchStoryboardName' "$APP_INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c 'Print UILaunchScreen' "$APP_INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c 'Print UISupportedInterfaceOrientations' "$APP_INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c 'Print UISupportedInterfaceOrientations~ipad' "$APP_INFO_PLIST" || true
          echo "::group::Embedded Info.plist (plutil -p)"
          /usr/bin/plutil -p "$APP_INFO_PLIST" | head -n 200 || true
          echo "::endgroup::"
          echo "::group::Embedded Info.plist (filtered dump)"
          if command -v rg >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Print' "$APP_INFO_PLIST" | rg -i 'orientation|launch|icon' || true
          else
            /usr/libexec/PlistBuddy -c 'Print' "$APP_INFO_PLIST" | grep -iE 'orientation|launch|icon' || true
          fi
          echo "::endgroup::"
          echo "::endgroup::"
          if ! /usr/libexec/PlistBuddy -c 'Print UISupportedInterfaceOrientations~ipad' "$APP_INFO_PLIST" >/dev/null 2>&1; then
            echo "ERROR: UISupportedInterfaceOrientations~ipad missing in embedded Info.plist"; exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print UILaunchScreen' "$APP_INFO_PLIST" >/dev/null 2>&1; then
            echo "ERROR: UILaunchScreen missing in embedded Info.plist"; exit 1
          fi

      - name: Export signed IPA (App Store)
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$EXPORT_DIR"
          ls -lah "$EXPORT_DIR"

      - name: Upload to TestFlight (Transporter API key)
        run: |
          set -euo pipefail
          IPA="$(ls -1 "$EXPORT_DIR"/*.ipa | head -n 1)"
          if [ ! -f "$IPA" ]; then echo "IPA not found"; ls -R "$EXPORT_DIR"; exit 1; fi
          echo "IPA found at: $IPA"
          ls -lah "$IPA" || true
          echo "Uploading to TestFlight via altool (API key)…"
          LOG="$RUNNER_TEMP/altool-upload.log"
          echo "altool path: $(xcrun -f altool || true)"
          set +e
          xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          # Fail on any ERROR or known failure lines regardless of exit code
          if grep -qiE '^ERROR:|UPLOAD FAILED|Cannot determine the Apple ID' "$LOG"; then
            echo "altool reported upload ERROR"; exit 1
          fi
          # Require definitive success marker
          if ! grep -qiE 'UPLOAD SUCCEEDED|No errors uploading package|Delivery has finished|bytes uploaded' "$LOG"; then
            echo "No definitive altool success marker detected — attempting Xcode-bundled iTMSTransporter fallback..."
            FBLOG="$RUNNER_TEMP/transporter-fallback.log"
            set +e
            TX="$((dirname $(xcode-select -p)))/SharedFrameworks/ContentDeliveryServices.framework/Versions/A/usr/bin/iTMSTransporter"
            if [ -x "$TX" ]; then
              "$TX" -m upload -assetFile "$IPA" -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v informational -t Upload 2>&1 | tee "$FBLOG"
              FBSTATUS=${PIPESTATUS[0]}
              set -e
              if grep -qi '^ERROR:' "$FBLOG"; then
                echo "Fallback iTMSTransporter reported ERROR"; exit 1
              fi
              if ! grep -qiE 'has been uploaded successfully|No errors uploading|Transporter transfer successful|Delivery UUID' "$FBLOG"; then
                echo "No definitive Transporter success marker in fallback"; exit 1
              fi
              exit $FBSTATUS
            else
              echo "Fallback iTMSTransporter not found at $TX"; exit 1
            fi
          fi
          exit $STATUS

