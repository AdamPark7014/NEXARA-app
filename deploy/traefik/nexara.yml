http:
  routers:
    # HTTP redirects
    console-http:
      rule: 'Host(`consola.nexara.com.mx`) || Host(`console.nexara.com.mx`) || Host(`app.nexara.com.mx`)'
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    public-http:
      rule: 'Host(`web.nexara.com.mx`) || Host(`nexara.com.mx`) || Host(`www.nexara.com.mx`)'
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    api-http:
      rule: 'Host(`api.nexara.com.mx`)'
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    # HTTPS routes
    # Console/Admin Dashboard
    console:
      rule: 'Host(`consola.nexara.com.mx`) || Host(`console.nexara.com.mx`) || Host(`app.nexara.com.mx`)'
      entryPoints:
        - websecure
      service: nexara-web
      tls:
        certResolver: letsencrypt

    # Public website
    public:
      rule: 'Host(`web.nexara.com.mx`) || Host(`nexara.com.mx`) || Host(`www.nexara.com.mx`)'
      entryPoints:
        - websecure
      service: nexara-web
      tls:
        certResolver: letsencrypt

    # API backend
    api:
      rule: 'Host(`api.nexara.com.mx`)'
      entryPoints:
        - websecure
      service: nexara-api
      tls:
        certResolver: letsencrypt

  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    nexara-web:
      loadBalancer:
        servers:
          - url: 'http://nexara-web:3000'

    nexara-api:
      loadBalancer:
        servers:
          - url: 'http://nexara-api:3001'

    dummy:
      loadBalancer:
        servers:
          - url: 'http://localhost'
