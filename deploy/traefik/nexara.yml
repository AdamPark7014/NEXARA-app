## Traefik routing for NEXARA ERP
##
## Estructura de subdominios canónicos (todos terminan en .nexara.com.mx):
##   core      → ERP principal (console)
##   sales     → CRM (ventas)
##   ops       → Operaciones técnicas (operacion)
##   finance   → Administración / contabilidad
##   studio    → Estudio creativo / marketing (panel web)
##   portal    → Portal de clientes empresariales (tickets)
##   support   → Helpdesk interno
##   noc       → Centro de monitoreo 24/7
##   people    → Recursos humanos
##   lab       → Playground interno (AI/dev)
##   api       → Backend NestJS
##   (raíz)    → Sitio público
##
## Hosts legacy (aliases): consola, console, app, ventas, operacion, contabilidad,
## web, tickets, crm, admin, media, help, monitor, rh, hr, dev. Estos llegan al
## mismo backend; el middleware de Next.js los redirige 308 al canónico.

http:
  routers:
    # ───────────────────────────────────────────────────────────
    # HTTP → HTTPS redirects (todos los subdominios)
    # ───────────────────────────────────────────────────────────
    erp-http:
      rule: >-
        Host(`core.nexara.com.mx`) ||
        Host(`consola.nexara.com.mx`) ||
        Host(`console.nexara.com.mx`) ||
        Host(`app.nexara.com.mx`) ||
        Host(`sales.nexara.com.mx`) ||
        Host(`ventas.nexara.com.mx`) ||
        Host(`crm.nexara.com.mx`) ||
        Host(`ops.nexara.com.mx`) ||
        Host(`operacion.nexara.com.mx`) ||
        Host(`finance.nexara.com.mx`) ||
        Host(`contabilidad.nexara.com.mx`) ||
        Host(`admin.nexara.com.mx`) ||
        Host(`studio.nexara.com.mx`) ||
        Host(`media.nexara.com.mx`) ||
        Host(`web.nexara.com.mx`) ||
        Host(`portal.nexara.com.mx`) ||
        Host(`tickets.nexara.com.mx`) ||
        Host(`support.nexara.com.mx`) ||
        Host(`help.nexara.com.mx`) ||
        Host(`noc.nexara.com.mx`) ||
        Host(`monitor.nexara.com.mx`) ||
        Host(`people.nexara.com.mx`) ||
        Host(`rh.nexara.com.mx`) ||
        Host(`hr.nexara.com.mx`) ||
        Host(`lab.nexara.com.mx`) ||
        Host(`dev.nexara.com.mx`)
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    public-http:
      rule: 'Host(`nexara.com.mx`) || Host(`www.nexara.com.mx`)'
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    api-http:
      rule: 'Host(`api.nexara.com.mx`)'
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    # ───────────────────────────────────────────────────────────
    # Socket.IO backend (real-time) en TODOS los subdominios del ERP
    # ───────────────────────────────────────────────────────────
    socket-io:
      rule: 'HostRegexp(`{sub:(core|consola|console|app|sales|ventas|crm|ops|operacion|finance|contabilidad|admin|studio|media|web|portal|tickets|support|help|noc|monitor|people|rh|hr|lab|dev)}.nexara.com.mx`) && PathPrefix(`/socket.io`)'
      entryPoints:
        - websecure
      service: nexara-api
      priority: 101
      tls:
        certResolver: letsencrypt

    # ───────────────────────────────────────────────────────────
    # Uploads estáticos (máxima prioridad, todos los subdominios)
    # ───────────────────────────────────────────────────────────
    uploads:
      rule: 'PathPrefix(`/uploads`)'
      entryPoints:
        - websecure
      service: nexara-api
      priority: 102
      tls:
        certResolver: letsencrypt

    # ───────────────────────────────────────────────────────────
    # API backend bajo /api en todos los subdominios del ERP
    # ───────────────────────────────────────────────────────────
    api:
      rule: 'HostRegexp(`{sub:(core|consola|console|app|sales|ventas|crm|ops|operacion|finance|contabilidad|admin|studio|media|web|portal|tickets|support|help|noc|monitor|people|rh|hr|lab|dev)}.nexara.com.mx`) && PathPrefix(`/api`)'
      entryPoints:
        - websecure
      service: nexara-api
      priority: 100
      tls:
        certResolver: letsencrypt

    api-direct:
      rule: 'Host(`api.nexara.com.mx`)'
      entryPoints:
        - websecure
      service: nexara-api
      tls:
        certResolver: letsencrypt

    # ───────────────────────────────────────────────────────────
    # Frontends (Next.js). El middleware de Next mapea cada host
    # a su carpeta interna y redirige aliases → canónicos.
    # ───────────────────────────────────────────────────────────
    erp-frontends:
      rule: 'HostRegexp(`{sub:(core|consola|console|app|sales|ventas|crm|ops|operacion|finance|contabilidad|admin|studio|media|web|portal|tickets|support|help|noc|monitor|people|rh|hr|lab|dev)}.nexara.com.mx`) && !PathPrefix(`/api`) && !PathPrefix(`/socket.io`) && !PathPrefix(`/uploads`)'
      entryPoints:
        - websecure
      service: nexara-web
      priority: 10
      tls:
        certResolver: letsencrypt

    # Sitio público
    public:
      rule: 'Host(`nexara.com.mx`)'
      entryPoints:
        - websecure
      service: nexara-web
      priority: 10
      tls:
        certResolver: letsencrypt

    public-www:
      rule: 'Host(`www.nexara.com.mx`)'
      entryPoints:
        - websecure
      service: nexara-web
      priority: 10
      tls:
        certResolver: letsencrypt

  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    nexara-web:
      loadBalancer:
        servers:
          - url: 'http://nexara-web:3000'

    nexara-api:
      loadBalancer:
        servers:
          - url: 'http://nexara-api:3001'

    dummy:
      loadBalancer:
        servers:
          - url: 'http://localhost'
