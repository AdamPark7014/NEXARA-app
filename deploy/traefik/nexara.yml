## Traefik routing for NEXARA ERP
##
## Desde el 14-11-2026 el ERP vive SOLO en app.nexara.com.mx (Adam cambió core → app en
## el DNS de GoDaddy y borró los demás subdominios de páginas). En el DNS quedan:
##   app       → ERP (web Next.js; /api, /socket.io y /uploads van a la API)
##   api       → Backend NestJS
##   (raíz)    → Sitio público (www → raíz)
##   email / autodiscover → correo (GoDaddy / Microsoft 365), no pasan por aquí
##
## core.nexara.com.mx ya no resuelve; si algún día vuelve al DNS, el router
## `core-a-app` lo manda con 301 a app. conservando la ruta.
## integra.nexara.com.mx tampoco resuelve; se conservan sus rutas de equipos (aviso del
## NVR por HTTP, go2rtc y /api) porque no son páginas.

http:
  routers:
    # ───────────────────────────────────────────────────────────
    # HTTP → HTTPS redirects (todos los subdominios)
    # ───────────────────────────────────────────────────────────
    erp-http:
      # Solo hosts con router HTTPS real. Aliases muertos (consola, crm, admin,
      # media, help, monitor, rh, hr, dev) NO van aquí: un 301 permanente + HSTS
      # con includeSubDomains deja el host inaccesible un año en el navegador.
      rule: >-
        (Host(`app.nexara.com.mx`) ||
        Host(`core.nexara.com.mx`) ||
        Host(`integra.nexara.com.mx`)) && !PathPrefix(`/api/integra/hik`)
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    # NVR Oficinas: httpHosts solo acepta HTTP (HTTPS → badXmlContent).
    # Prioridad alta para no caer en el redirect-https de erp-http.
    # Su `hostName` es el correcto, pero el firmware manda la IP en el Host (medido el 02-11):
    # sin la segunda condición Traefik contesta 404 y el aviso nunca llega a la API.
    integra-hik-push-http:
      rule: '(Host(`integra.nexara.com.mx`) || Host(`5.78.215.109`)) && PathPrefix(`/api/integra/hik`)'
      entryPoints:
        - web
      middlewares:
        - integra-hik-host
      service: nexara-api
      priority: 200

    public-http:
      rule: 'Host(`nexara.com.mx`)'
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    public-www-http:
      rule: 'Host(`www.nexara.com.mx`)'
      entryPoints:
        - web
      middlewares:
        - www-to-apex-http
      service: dummy

    api-http:
      rule: 'Host(`api.nexara.com.mx`)'
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: dummy

    # ───────────────────────────────────────────────────────────
    # Socket.IO backend (real-time) en app. (integra: equipos)
    # ───────────────────────────────────────────────────────────
    socket-io:
      rule: 'Host(`app.nexara.com.mx`,`integra.nexara.com.mx`) && PathPrefix(`/socket.io`)'
      entryPoints:
        - websecure
      service: nexara-api
      priority: 101
      tls:
        certResolver: letsencrypt

    # ───────────────────────────────────────────────────────────
    # Uploads estáticos (máxima prioridad, todos los subdominios)
    # ───────────────────────────────────────────────────────────
    uploads:
      rule: 'PathPrefix(`/uploads`)'
      entryPoints:
        - websecure
      service: nexara-api
      priority: 102
      tls:
        certResolver: letsencrypt

    # ───────────────────────────────────────────────────────────
    # API backend bajo /api en app. (integra: equipos y agentes edge)
    # ───────────────────────────────────────────────────────────
    api:
      rule: 'Host(`app.nexara.com.mx`,`integra.nexara.com.mx`) && PathPrefix(`/api`)'
      entryPoints:
        - websecure
      service: nexara-api
      priority: 100
      tls:
        certResolver: letsencrypt

    api-direct:
      rule: 'Host(`api.nexara.com.mx`)'
      entryPoints:
        - websecure
      service: nexara-api
      tls:
        certResolver: letsencrypt

    # ───────────────────────────────────────────────────────────
    # Frontend (Next.js): el ERP vive solo en app.nexara.com.mx.
    # Certificado propio de app. (antes iba como SAN del certificado de console,
    # junto con subdominios que ya no existen y no se podría renovar).
    # ───────────────────────────────────────────────────────────
    app-frontend:
      rule: 'Host(`app.nexara.com.mx`) && !PathPrefix(`/api`) && !PathPrefix(`/socket.io`) && !PathPrefix(`/uploads`)'
      entryPoints: [websecure]
      service: nexara-web
      priority: 20
      tls:
        certResolver: letsencrypt
        domains:
          - main: app.nexara.com.mx

    # core.nexara.com.mx → app.nexara.com.mx (301 en GET, 308 en el resto), con la misma ruta.
    # Hoy core. no tiene DNS; esto sirve si vuelve, para ligas viejas de correos y apps.
    core-a-app:
      rule: 'Host(`core.nexara.com.mx`)'
      entryPoints: [websecure]
      middlewares:
        - core-a-app
      service: dummy
      priority: 200
      tls:
        certResolver: letsencrypt

    # Media gateway — solo rutas que el navegador usa. /api/streams y /api/config
    # filtran RTSP con credenciales en claro; no deben salir a internet.
    integra-go2rtc:
      rule: >-
        Host(`integra.nexara.com.mx`) && (
        Path(`/go2rtc/video-stream.js`) ||
        Path(`/go2rtc/video-rtc.js`) ||
        Path(`/go2rtc/api/ws`) ||
        Path(`/go2rtc/api/frame.jpeg`) ||
        Path(`/go2rtc/api/stream.m3u8`) ||
        Path(`/go2rtc/api/stream.mp4`) ||
        PathPrefix(`/go2rtc/api/stream.m3u8/`) ||
        PathPrefix(`/go2rtc/api/hls/`) ||
        PathPrefix(`/go2rtc/api/webrtc`) )
      entryPoints: [websecure]
      # Primero la API decide (firma del stream o sesión de personal), después se quita /go2rtc.
      middlewares:
        - integra-go2rtc-auth
        - integra-go2rtc-strip
      service: nexara-go2rtc
      priority: 30
      tls:
        certResolver: letsencrypt

    # Sitio público (apex). www → apex 301 para consolidar señal canonical.
    public-www:
      rule: 'Host(`www.nexara.com.mx`)'
      entryPoints:
        - websecure
      middlewares:
        - www-to-apex
      service: dummy
      priority: 25
      tls:
        certResolver: letsencrypt

    public:
      rule: 'Host(`nexara.com.mx`)'
      entryPoints:
        - websecure
      service: nexara-web
      priority: 10
      tls:
        certResolver: letsencrypt
        domains:
          - main: nexara.com.mx
            sans:
              - www.nexara.com.mx

  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

    www-to-apex-http:
      redirectRegex:
        regex: "^http://www\\.nexara\\.com\\.mx(.*)"
        replacement: "https://nexara.com.mx${1}"
        permanent: true

    core-a-app:
      redirectRegex:
        regex: "^https?://core\\.nexara\\.com\\.mx(.*)"
        replacement: "https://app.nexara.com.mx${1}"
        permanent: true

    www-to-apex:
      redirectRegex:
        regex: "^https://www\\.nexara\\.com\\.mx(.*)"
        replacement: "https://nexara.com.mx${1}"
        permanent: true

    # go2rtc no tiene autenticación propia: sin esto, cualquiera veía cámaras con el nombre del
    # stream. Solo Cookie y Authorization: los encabezados de WebSocket (Upgrade) no deben llegar
    # a la API. Código: apps/api/src/integra/go2rtc-autorizacion.ts.
    integra-go2rtc-auth:
      forwardAuth:
        address: http://nexara-api:3001/api/integra/media/authz
        authRequestHeaders:
          - Cookie
          - Authorization

    integra-go2rtc-strip:
      stripPrefix:
        prefixes:
          - /go2rtc

    # La API rechaza un Host con IP (`isHostAllowed`): 400 y 2 strikes. Sin esta reescritura, al
    # tercer aviso del NVR bloquearía 1 h la IP de la oficina, con terminales, cámaras y personas.
    integra-hik-host:
      headers:
        customRequestHeaders:
          Host: integra.nexara.com.mx

  services:
    nexara-web:
      loadBalancer:
        healthCheck:
          path: /
          # `hostname` es OBLIGATORIO aquí, no un adorno.
          #
          # El middleware de Next.js valida la cabecera Host contra una lista
          # blanca (`buildDefaultAllowedHostPatterns` en apps/web/middleware.ts).
          # La sonda de Traefik viaja con `Host: nexara-web:3000`, que no está en
          # esa lista, así que el web responde **400** y Traefik lo marca como
          # caído. Resultado: 503 en TODOS los subdominios aunque el contenedor
          # esté perfectamente sano.
          #
          # Pasó en producción el 07-09-2026, al desplegar estos healthChecks:
          # core, sales, ops e integra cayeron a la vez. Verificado en el
          # servidor: con `Host: nexara-web:3000` → 400; con un host de la lista
          # → 200.
          hostname: app.nexara.com.mx
          # Sin seguir redirecciones: una 3xx ya prueba que Next responde; seguirla saldría
          # a internet y, si el destino no resuelve (pasó con core. el 14-11), daría 503 en todo.
          followRedirects: false
          interval: 15s
          timeout: 5s
        servers:
          - url: 'http://nexara-web:3000'

    nexara-api:
      loadBalancer:
        healthCheck:
          path: /api/health/live
          interval: 10s
          timeout: 3s
        servers:
          - url: 'http://nexara-api:3001'

    nexara-go2rtc:
      loadBalancer:
        healthCheck:
          path: /api
          interval: 15s
          timeout: 5s
        servers:
          - url: 'http://nexara-go2rtc:1984'

    dummy:
      loadBalancer:
        servers:
          - url: 'http://localhost'

# TLS 1.2+ (requisito SAT para timbrado vía internet)
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
    sat-compliant:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      sniStrict: true
