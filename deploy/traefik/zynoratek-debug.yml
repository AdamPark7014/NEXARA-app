## Traefik routing for ZYNORATEK - DEBUG MODE (HTTP only)

http:
  routers:
    zynoratek-http:
      rule: 'Host(`zynoratek.com`, `www.zynoratek.com`)'
      entryPoints: [web]
      service: zynoratek-web

  services:
    zynoratek-web:
      loadBalancer:
        servers:
          - url: http://zynoratek-web-1:3000
