## Traefik routing for Zynoratek (multi-locale + API)
##
## Hostnames con cert Let's Encrypt ya emitidos:
##
## Frontend (web), todos resuelven al mismo Next.js (zynoratek-web-1):
##   - zynoratek.com           (apex)
##   - www.zynoratek.com       (alias)
##   - es.zynoratek.com        (locale español)
##   - en.zynoratek.com        (inglés)
##   - fr.zynoratek.com        (francés)
##   - de.zynoratek.com        (alemán)
##   - pt.zynoratek.com        (portugués)
##   - ar.zynoratek.com        (árabe)
##   - hi.zynoratek.com        (hindi)
##   - zh.zynoratek.com        (chino)
##   - ja.zynoratek.com        (japonés)
##   - ru.zynoratek.com        (ruso)
##
## API backend (zynoratek-api-1):
##   - api.zynoratek.com
##
## El frontend distingue el idioma vía hostname (sub.zynoratek.com)
## o cookie zyn_locale.

http:
  routers:
    # ─── HTTP → HTTPS para TODOS los hosts ────────────────────
    zynoratek-http:
      rule: >-
        Host(`zynoratek.com`,`www.zynoratek.com`,
             `es.zynoratek.com`,`en.zynoratek.com`,`fr.zynoratek.com`,
             `de.zynoratek.com`,`pt.zynoratek.com`,`ar.zynoratek.com`,
             `hi.zynoratek.com`,`zh.zynoratek.com`,`ja.zynoratek.com`,
             `ru.zynoratek.com`,`api.zynoratek.com`)
      entryPoints: [web]
      middlewares: [redirect-https-zynoratek]
      service: dummy-zynoratek

    # ─── Frontend (todos los locales y apex) ──────────────────
    zynoratek-https:
      rule: >-
        Host(`zynoratek.com`,`www.zynoratek.com`,
             `es.zynoratek.com`,`en.zynoratek.com`,`fr.zynoratek.com`,
             `de.zynoratek.com`,`pt.zynoratek.com`,`ar.zynoratek.com`,
             `hi.zynoratek.com`,`zh.zynoratek.com`,`ja.zynoratek.com`,
             `ru.zynoratek.com`)
      service: zynoratek-web
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: zynoratek.com
            sans:
              - www.zynoratek.com
              - es.zynoratek.com
              - en.zynoratek.com
              - fr.zynoratek.com
              - de.zynoratek.com
              - pt.zynoratek.com
              - ar.zynoratek.com
              - hi.zynoratek.com
              - zh.zynoratek.com
              - ja.zynoratek.com
              - ru.zynoratek.com

    # ─── API backend ──────────────────────────────────────────
    zynoratek-api-https:
      rule: 'Host(`api.zynoratek.com`)'
      service: zynoratek-api
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt

  middlewares:
    redirect-https-zynoratek:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    zynoratek-web:
      loadBalancer:
        servers:
          - url: http://zynoratek-web-1:3000

    zynoratek-api:
      loadBalancer:
        servers:
          # NOTA: si el backend escucha en otro puerto, ajusta aquí.
          # Lo más común para NestJS/Express es 3001 o 3000. Verifica
          # con: docker exec zynoratek-api-1 sh -c 'echo $PORT' o ver
          # el Dockerfile/EXPOSE del proyecto.
          - url: http://zynoratek-api-1:3001

    dummy-zynoratek:
      loadBalancer:
        servers:
          - url: http://localhost
