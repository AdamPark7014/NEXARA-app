# NEXARA Integra · go2rtc sidecar (RTSP → HLS)
# Docs: https://github.com/AlexxIT/go2rtc
api:
  listen: ":1984"
  # Sin `origin: "*"`: el WebSocket de video solo acepta páginas del mismo dominio. Quién entra lo
  # decide el forwardAuth de Traefik (deploy/traefik/nexara.yml → /api/integra/media/authz).

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
