name: nexara

services:
  # NOTE: Traefik is managed globally via traefik-main container.
  # This compose only defines services: db, api, web

  db:
    image: postgres:16
    container_name: nexara-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nexara-postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: nexara-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - nexara-redis-data:/data
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: nexara-api
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - go2rtc
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      # 1 = API also runs BullMQ workers (default). Set 0 when `worker` profile is up.
      JOBS_RUN_WORKERS: ${JOBS_RUN_WORKERS:-1}
      # SaaS hard multi-tenant: set to 0 when all clients send X-Company-Id
      TENANT_ALLOW_PRIMARY_FALLBACK: ${TENANT_ALLOW_PRIMARY_FALLBACK:-1}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      WEB_URL: ${WEB_URL}
      PUBLIC_WEB_URL: ${WEB_URL}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY}
      WEB_PUSH_CONTACT: ${WEB_PUSH_CONTACT}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      BREVO_NEWSLETTER_LIST_ID: ${BREVO_NEWSLETTER_LIST_ID}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      # ACS oficinas + Integra (Artemis). Ver ADR-0017.
      OFFICES_HIK_HOST: ${OFFICES_HIK_HOST:-}
      OFFICES_HIK_APP_KEY: ${OFFICES_HIK_APP_KEY:-}
      OFFICES_HIK_APP_SECRET: ${OFFICES_HIK_APP_SECRET:-}
      OFFICES_HIK_TIMEOUT: ${OFFICES_HIK_TIMEOUT:-15000}
      HIKVISION_URL: ${HIKVISION_URL:-}
      HIK_APP_KEY: ${HIK_APP_KEY:-}
      HIK_APP_SECRET: ${HIK_APP_SECRET:-}
      INTEGRA_HIK_HOST: ${INTEGRA_HIK_HOST:-}
      INTEGRA_HIK_APP_KEY: ${INTEGRA_HIK_APP_KEY:-}
      INTEGRA_HIK_APP_SECRET: ${INTEGRA_HIK_APP_SECRET:-}
      INTEGRA_SECRETS_KEY: ${INTEGRA_SECRETS_KEY:-}
      GO2RTC_URL: ${GO2RTC_URL:-http://nexara-go2rtc:1984}
      GO2RTC_PUBLIC_URL: ${GO2RTC_PUBLIC_URL:-https://integra.nexara.com.mx/go2rtc}
      GLOBAL_RATE_LIMIT_MAX: ${GLOBAL_RATE_LIMIT_MAX:-1200}
      GLOBAL_RATE_LIMIT_WINDOW_MS: ${GLOBAL_RATE_LIMIT_WINDOW_MS:-60000}
      # CFDI / SAT / PAC
      PAC_PROVIDER: ${PAC_PROVIDER:-mock}
      PAC_FALLBACK_TO_MOCK: ${PAC_FALLBACK_TO_MOCK:-1}
      FACTURAMA_USER: ${FACTURAMA_USER:-}
      FACTURAMA_PASSWORD: ${FACTURAMA_PASSWORD:-}
      FACTURAMA_BASE_URL: ${FACTURAMA_BASE_URL:-}
      SW_TOKEN: ${SW_TOKEN:-}
      SW_USER: ${SW_USER:-}
      SW_PASSWORD: ${SW_PASSWORD:-}
      SW_BASE_URL: ${SW_BASE_URL:-}
      SW_USE_ISSUE_JSON: ${SW_USE_ISSUE_JSON:-}
      FINKOK_USER: ${FINKOK_USER:-}
      FINKOK_PASSWORD: ${FINKOK_PASSWORD:-}
      FINKOK_BASE_URL: ${FINKOK_BASE_URL:-}
      CSD_CER_BASE64: ${CSD_CER_BASE64:-}
      CSD_KEY_BASE64: ${CSD_KEY_BASE64:-}
      CSD_KEY_PASSWORD: ${CSD_KEY_PASSWORD:-}
      CSD_CER_PATH: ${CSD_CER_PATH:-}
      CSD_KEY_PATH: ${CSD_KEY_PATH:-}
      EFIRMA_CER_BASE64: ${EFIRMA_CER_BASE64:-}
      EFIRMA_KEY_BASE64: ${EFIRMA_KEY_BASE64:-}
      EFIRMA_KEY_PASSWORD: ${EFIRMA_KEY_PASSWORD:-}
      EFIRMA_CER_PATH: ${EFIRMA_CER_PATH:-}
      EFIRMA_KEY_PATH: ${EFIRMA_KEY_PATH:-}
      UPLOADS_ROOT: /app/uploads
      # CT Online — Smart Quote catalog sync
      CT_FTP_HOST: ${CT_FTP_HOST:-}
      CT_FTP_USER: ${CT_FTP_USER:-}
      CT_FTP_PASSWORD: ${CT_FTP_PASSWORD:-}
      CT_FTP_SECURE: ${CT_FTP_SECURE:-0}
      CT_FTP_PATH: ${CT_FTP_PATH:-/catalogo_xml}
      CT_FTP_JSON_FILE: ${CT_FTP_JSON_FILE:-productos.json}
      CT_FTP_XML_FILE: ${CT_FTP_XML_FILE:-productos.xml}
      CT_SUPPLIER_CODE: ${CT_SUPPLIER_CODE:-CT}
      CT_PREFERRED_WAREHOUSE: ${CT_PREFERRED_WAREHOUSE:-PUE}
      CT_SYNC_CRON_MINUTES: ${CT_SYNC_CRON_MINUTES:-15}
      CT_SYNC_ENABLED: ${CT_SYNC_ENABLED:-1}
      # CT Online — pedidos API (distinto del FTP de catálogo)
      CT_API_BASE_URL: ${CT_API_BASE_URL:-}
      CT_API_EMAIL: ${CT_API_EMAIL:-}
      CT_API_CLIENTE: ${CT_API_CLIENTE:-}
      CT_API_RFC: ${CT_API_RFC:-}
      CT_API_ALMACEN: ${CT_API_ALMACEN:-01A}
      CT_FALLBACK_FX: ${CT_FALLBACK_FX:-17}
    volumes:
      - ../uploads:/app/uploads
    networks:
      - internal
      - proxy

  # Optional dedicated BullMQ consumer: docker compose --profile worker up -d
  # Pair with JOBS_RUN_WORKERS=0 on api to avoid double-consuming.
  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: nexara-worker
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JOBS_RUN_WORKERS: "1"
      JWT_SECRET: ${JWT_SECRET}
      UPLOADS_ROOT: /app/uploads
    command: ["sh", "-c", "cd /app/apps/api && node /app/apps/api/dist/worker.js"]
    volumes:
      - ../uploads:/app/uploads
    networks:
      - internal

  # Media gateway: RTSP Artemis → HLS para player HTML5 (Integra).
  go2rtc:
    image: alexxit/go2rtc:1.9.7
    container_name: nexara-go2rtc
    restart: unless-stopped
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:rw
    networks:
      - internal
      - proxy

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${WEB_NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${WEB_NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_BASE_URL: ${WEB_NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_API_ASSET_ORIGIN: ${WEB_NEXT_PUBLIC_API_ASSET_ORIGIN}
        NEXT_PUBLIC_ALLOW_CROSS_ORIGIN_API: ${WEB_NEXT_PUBLIC_ALLOW_CROSS_ORIGIN_API}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${WEB_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${WEB_NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID}
        NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${WEB_NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY}
        NEXT_PUBLIC_WEB_PUSH_CONSENT_MODE: ${WEB_NEXT_PUBLIC_WEB_PUSH_CONSENT_MODE}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${WEB_NEXT_PUBLIC_GA_MEASUREMENT_ID}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${WEB_NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${WEB_NEXT_PUBLIC_BING_SITE_VERIFICATION}
        NEXT_PUBLIC_CONTACT_PHONE: ${WEB_NEXT_PUBLIC_CONTACT_PHONE}
        NEXT_PUBLIC_CONTACT_EMAIL: ${WEB_NEXT_PUBLIC_CONTACT_EMAIL}
        NEXT_PUBLIC_CITY: ${WEB_NEXT_PUBLIC_CITY}
        NEXT_PUBLIC_STATE: ${WEB_NEXT_PUBLIC_STATE}
    container_name: nexara-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${WEB_NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SOCKET_URL: ${WEB_NEXT_PUBLIC_SOCKET_URL}
      NEXT_PUBLIC_BASE_URL: ${WEB_NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_API_ASSET_ORIGIN: ${WEB_NEXT_PUBLIC_API_ASSET_ORIGIN}
      NEXT_PUBLIC_ALLOW_CROSS_ORIGIN_API: ${WEB_NEXT_PUBLIC_ALLOW_CROSS_ORIGIN_API}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${WEB_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${WEB_NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID}
      NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${WEB_NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY}
      NEXT_PUBLIC_WEB_PUSH_CONSENT_MODE: ${WEB_NEXT_PUBLIC_WEB_PUSH_CONSENT_MODE}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${WEB_NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${WEB_NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${WEB_NEXT_PUBLIC_BING_SITE_VERIFICATION}
      NEXT_PUBLIC_CONTACT_PHONE: ${WEB_NEXT_PUBLIC_CONTACT_PHONE}
      NEXT_PUBLIC_CONTACT_EMAIL: ${WEB_NEXT_PUBLIC_CONTACT_EMAIL}
      NEXT_PUBLIC_CITY: ${WEB_NEXT_PUBLIC_CITY}
      NEXT_PUBLIC_STATE: ${WEB_NEXT_PUBLIC_STATE}
      API_INTERNAL_URL: http://nexara-api:3001/api
    labels:
      - traefik.enable=false
    networks:
      - internal
      - proxy

volumes:
  nexara-postgres-data:
  nexara-redis-data:

networks:
  internal:
  proxy:
    external: true
