services:
  nexara-api:
    image: nexara-api:latest
    build:
      context: .
      dockerfile: ./deploy/docker/Dockerfile.api
    container_name: nexara-api
    restart: unless-stopped
    expose:
      - 3001
    environment:
      - DATABASE_URL=postgresql://nexara:Nx@r4_Secure_2024!@nexara-db:5432/nexara?schema=public
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - HIKVISION_URL=${HIKVISION_URL:-http://hikcentral:54483}
      - HIKVISION_PORT=${HIKVISION_PORT:-54483}
      - HIKVISION_USERNAME=${HIKVISION_USERNAME:-admin}
      - HIKVISION_PASSWORD=${HIKVISION_PASSWORD:-password}
      - HIKVISION_TIMEOUT=${HIKVISION_TIMEOUT:-10000}
    # Volumen para uploads de Studio (banner del hero, noticias, evidencias,
    # documentos, etc.). El backend guarda en `./uploads/<modulo>/` y los
    # sirve vía endpoints `/api/<modulo>/image/:filename`. El volumen named
    # `nexara-uploads` sobrevive a `docker compose down` y a redeploys.
    volumes:
      - nexara-uploads:/app/uploads
    depends_on:
      - nexara-db
    networks:
      - nexara_internal
      - proxy
    labels:
      - traefik.enable=false

  nexara-web:
    image: nexara-web:latest
    build:
      context: .
      dockerfile: ./deploy/docker/Dockerfile.web
    container_name: nexara-web
    restart: unless-stopped
    expose:
      - 3000
    environment:
      - NEXT_PUBLIC_API_URL=http://api.nexara.com.mx
      - NEXT_PUBLIC_BASE_URL=http://consola.nexara.com.mx
    networks:
      - nexara_internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.services.nexara.loadbalancer.server.port=3000
      # Console subdomains
      - traefik.http.routers.console.rule=Host(`consola.nexara.com.mx`) || Host(`console.nexara.com.mx`) || Host(`app.nexara.com.mx`)
      - traefik.http.routers.console.entrypoints=websecure
      - traefik.http.routers.console.tls.certresolver=letsencrypt
      - traefik.http.routers.console.service=nexara
      # Public subdomains
      - traefik.http.routers.public.rule=Host(`web.nexara.com.mx`) || Host(`nexara.com.mx`) || Host(`www.nexara.com.mx`)
      - traefik.http.routers.public.entrypoints=websecure
      - traefik.http.routers.public.tls.certresolver=letsencrypt
      - traefik.http.routers.public.service=nexara

  nexara-db:
    image: postgres:16
    container_name: nexara-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nexara
      - POSTGRES_PASSWORD=Nx@r4_Secure_2024!
      - POSTGRES_DB=nexara
    volumes:
      - nexara-db-data:/var/lib/postgresql/data
    networks:
      - nexara_internal
    labels:
      - traefik.enable=false

networks:
  nexara_internal:
    external: true
    name: nexara_internal
  proxy:
    external: true
    name: proxy

volumes:
  nexara-db-data:
    name: nexara-db-data
  nexara-uploads:
    name: nexara-uploads
