name: NexaraApp

# Este fichero es la única definición del proyecto Xcode: `NexaraApp.xcodeproj`
# NO se versiona, se genera con `xcodegen generate` dentro del runner de macOS.
# Todo lo que antes se hacía a mano en la interfaz de Xcode (firmar, capacidades,
# paquetes, icono) está declarado aquí para que la construcción no necesite Mac.

options:
  bundleIdPrefix: mx.nexara.mobile
  deploymentTarget:
    # iOS 17, no 16, porque el codigo YA usa APIs de iOS 17 en 27 ficheros:
    # `onChange(of:)` de dos parametros (25) y `ContentUnavailableView` (2), sin
    # una sola guarda `@available`. Con el objetivo en 16.0 no compilaba; se
    # descubrio el 08-09-2026, cuando se anadio a CI la compilacion para
    # simulador. Las alternativas eran reescribir 27 ficheros o subir el minimo:
    # iOS 17 cubre iPhone XS (2018) en adelante.
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # La versión real la inyecta el flujo de trabajo por línea de órdenes
    # (`MARKETING_VERSION` de la entrada, `CURRENT_PROJECT_VERSION` del número
    # de ejecución). Estos valores solo sirven para compilar en local.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1

targets:
  NexaraApp:
    type: application
    platform: iOS
    sources:
      - path: NexaraApp
      - path: Resources/Assets.xcassets
    dependencies:
      - package: SocketIO
        product: SocketIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.nexara.mobile.NexaraApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # `INFOPLIST_FILE` en vez del bloque `info:` a propósito. Con `info:`,
        # XcodeGen REGENERA la plist con las claves que se listen aquí y borra
        # el resto: se habría llevado las siete cadenas de permisos
        # (ubicación, cámara, fotos, micrófono, seguimiento) y Apple rechaza
        # cualquier binario que use esas API sin su descripción.
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        # El identificador de equipo lo inyecta el flujo desde un secreto: el
        # repositorio es público y no tiene por qué llevarlo escrito.
        DEVELOPMENT_TEAM: ""
      configs:
        # APNs distingue dos entornos y el token de uno no vale en el otro.
        # TestFlight y App Store usan SIEMPRE `production`; solo la instalación
        # directa desde Xcode usa `development`.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/NexaraApp.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/NexaraApp.Release.entitlements

# XcodeGen no crea esquemas compartidos por su cuenta, y `xcodebuild -scheme`
# solo ve los compartidos. Sin este bloque la construcción falla con
# "scheme NexaraApp not found" incluso con el proyecto bien generado.
schemes:
  NexaraApp:
    build:
      targets:
        NexaraApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# Firebase NO se usa. El playbook anterior mandaba añadir firebase-ios-sdk a
# mano, pero no hay ni un `import Firebase` en los 134 ficheros Swift:
# `PushManager` manda el token APNs crudo a `POST devices/push-token` con
# `platform: "ios"`. Añadir el paquete costaría varios minutos de compilación
# por construcción y no cambiaría nada. Si algún día se cablea, se declara aquí
# como paquete y se añade `GoogleService-Info.plist` (ya está en .gitignore).
#
# Google Maps tampoco: `NexaraMapView` usa MapKit, que no lleva clave.
