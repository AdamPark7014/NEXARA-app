name: NexaraApp
options:
  bundleIdPrefix: mx.nexara.mobile
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1

targets:
  NexaraApp:
    type: application
    platform: iOS
    sources:
      - path: NexaraApp
      - path: Resources
        excludes:
          - "**/*.storyboard"
    dependencies:
      - package: SocketIO
        product: SocketIO
      - target: NexaraNotificationService
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: mx.nexara.mobile
            CFBundleURLSchemes:
              - nexara
    entitlements:
      path: Resources/NexaraApp.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.nexara.mobile.NexaraApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Resources/NexaraApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AHNW9K8745
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleIconName: AppIcon
    # Dependencias Firebase se agregan en Xcode vía Swift Package Manager:
    #   File > Add Packages > https://github.com/firebase/firebase-ios-sdk
    #   Agregar: FirebaseMessaging, FirebaseAnalytics.
    # Google Maps iOS NO es necesario: usamos MapKit nativo (sin key).

  NexaraNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    info:
      path: NotificationService/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.nexara.mobile.NexaraApp.NotificationService
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AHNW9K8745
