name: NexaraApp

# Este fichero es la única definición del proyecto Xcode: `NexaraApp.xcodeproj`
# NO se versiona, se genera con `xcodegen generate` dentro del runner de macOS.
# Todo lo que antes se hacía a mano en la interfaz de Xcode (firmar, capacidades,
# paquetes, icono) está declarado aquí para que la construcción no necesite Mac.

options:
  bundleIdPrefix: mx.nexara.mobile
  deploymentTarget:
    # iOS 17, no 16, porque el codigo YA usa APIs de iOS 17 en 27 ficheros:
    # `onChange(of:)` de dos parametros (25) y `ContentUnavailableView` (2), sin
    # una sola guarda `@available`. Con el objetivo en 16.0 no compilaba; se
    # descubrio el 08-09-2026, cuando se anadio a CI la compilacion para
    # simulador. Las alternativas eran reescribir 27 ficheros o subir el minimo:
    # iOS 17 cubre iPhone XS (2018) en adelante.
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # La versión real la inyecta el flujo de trabajo por línea de órdenes
    # (`MARKETING_VERSION` de la entrada, `CURRENT_PROJECT_VERSION` del número
    # de ejecución). Estos valores solo sirven para compilar en local.
    MARKETING_VERSION: "1.0.0"
    # Mayor que 1.0.0 (3) ya subida a TestFlight. El tag ios-testflight-* no
    # reescribe este número: Info.plist lleva el mismo CFBundleVersion.
    CURRENT_PROJECT_VERSION: "4"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  # Solo FirebaseMessaging: el API manda los push con firebase-admin (FCM), que
  # no acepta tokens APNs crudos. Ver el comentario del final.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  NexaraApp:
    type: application
    platform: iOS
    sources:
      - path: NexaraApp
      - path: Resources/Assets.xcassets
      # Configuración de cliente de Firebase (proyecto nexara-app), versionada. `optional` permite
      # generar el proyecto sin él (la app arranca, pero sin push FCM).
      - path: Resources/GoogleService-Info.plist
        optional: true
        buildPhase: resources
      # Manifiesto de privacidad de la app (Apple lo exige desde mayo de 2024:
      # APIs de "motivo requerido" y datos recopilados). NO es opcional: si
      # falta, el proyecto no se genera y el flujo de TestFlight lo verifica
      # tras archivar (debe quedar en la raíz del .app).
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.nexara.mobile.NexaraApp
        # Solo iPhone ("1"). Apple revisó la 1.0 en un iPad Air porque el binario
        # declaraba iPhone + iPad ("1,2") sin que la interfaz se hubiera diseñado
        # ni probado para iPad. Se vuelve a "1,2" solo cuando exista versión de
        # iPad; hasta entonces, iPhone-only.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # `INFOPLIST_FILE` en vez del bloque `info:` a propósito. Con `info:`,
        # XcodeGen REGENERA la plist con las claves que se listen aquí y borra
        # el resto: se habría llevado las siete cadenas de permisos
        # (ubicación, cámara, fotos, micrófono, Face ID) y Apple rechaza
        # cualquier binario que use esas API sin su descripción.
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        # El identificador de equipo lo inyecta el flujo desde un secreto: el
        # repositorio es público y no tiene por qué llevarlo escrito.
        DEVELOPMENT_TEAM: ""
      configs:
        # APNs distingue dos entornos y el token de uno no vale en el otro.
        # TestFlight y App Store usan SIEMPRE `production`; solo la instalación
        # directa desde Xcode usa `development`.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/NexaraApp.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/NexaraApp.Release.entitlements

  # Pruebas de interfaz (XCUITest). Las usa el flujo `ios-screenshots.yml` para
  # generar las capturas de la ficha desde el simulador de iPhone. NO entran en
  # el archivado ni en `xcodebuild build`: el esquema las construye solo en la
  # acción `test`. Sin firma: solo corren en simulador.
  NexaraAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NexaraAppUITests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: NexaraApp
    settings:
      base:
        TEST_TARGET_NAME: NexaraApp
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: mx.nexara.mobile.NexaraAppUITests
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO

# XcodeGen no crea esquemas compartidos por su cuenta, y `xcodebuild -scheme`
# solo ve los compartidos. Sin este bloque la construcción falla con
# "scheme NexaraApp not found" incluso con el proyecto bien generado.
schemes:
  NexaraApp:
    build:
      targets:
        NexaraApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NexaraAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# Firebase Messaging SÍ se usa (14-09-2026). El API envía con firebase-admin,
# así que el token que vale es el de FCM: `PushManager` configura Firebase solo
# si el binario trae `GoogleService-Info.plist` y registra ese token en
# `POST devices/push-token` con `platform: "ios"`. Sin el plist cae al token
# APNs crudo (compila y arranca, pero los push no llegan).
# El plist NO se versiona (.gitignore): el flujo de CI debe escribirlo en
# `Resources/GoogleService-Info.plist` desde un secreto ANTES de
# `xcodegen generate`. Además hay que subir la clave APNs (.p8) a Firebase.
#
# Google Maps tampoco: `NexaraMapView` usa MapKit, que no lleva clave.
