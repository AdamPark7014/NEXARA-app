<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Nexara command center hero</title>
  <desc id="desc">High-detail cyber command center with datacenter aisles, CCTV network, analytics walls, and secure operations core.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031126"/>
      <stop offset="30%" stop-color="#082b4f"/>
      <stop offset="66%" stop-color="#0f4a77"/>
      <stop offset="100%" stop-color="#158b88"/>
    </linearGradient>

    <radialGradient id="fogLeft" cx="0.16" cy="0.48" r="0.46">
      <stop offset="0%" stop-color="#55b9ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#55b9ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fogRight" cx="0.84" cy="0.45" r="0.46">
      <stop offset="0%" stop-color="#64efd6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#64efd6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreAura" cx="0.5" cy="0.6" r="0.38">
      <stop offset="0%" stop-color="#80dcff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#80dcff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="140" height="140" patternUnits="userSpaceOnUse">
      <path d="M140 0H0V140" fill="none" stroke="#b8e8ff" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b365f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020c19" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1f7ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#a7deff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="rackEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ddfff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9ddfff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bcefff" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#7bd7ff" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#def6ff"/>
      <stop offset="100%" stop-color="#74ebd0"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

